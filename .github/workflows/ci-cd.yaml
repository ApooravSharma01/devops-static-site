name: CI/CD Pipeline

on:
  push:
    branches: [ main ]   # jab bhi main branch me push hoga, pipeline chalegi

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-implementation:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-implementation:latest
